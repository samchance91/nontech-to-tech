<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Learn how software really works — adaptive, hands-on, at your level. Works offline." />
  <title>Propelr — Tech for Non-Tech People</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar__in">
      <a class="wordmark" href="#/" aria-label="Propelr home"><span class="wordmark__dot" aria-hidden="true"></span>Propelr</a>
      <div class="appbar__actions">
        <span class="offline-pill" role="status">● offline</span>
        <div class="menu needs-auth" id="menuWrap">
          <button class="btn btn--secondary btn--sm" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="menu__panel" id="menuPanel" role="menu" aria-label="Menu" hidden></div>
        </div>
        <button class="levelbadge needs-auth" id="levelBadge" type="button" aria-label="Your level"></button>
        <button class="profilebtn needs-auth" id="profileBtn" type="button" aria-label="Your profile"></button>
        <button class="btn btn--secondary btn--sm iconbtn" id="themeBtn" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <div id="recall" class="container" style="padding:0 var(--s4)"></div>
  <main id="view" class="container" style="padding:var(--s5) var(--s4) var(--s9)" tabindex="-1"></main>
  <div id="px-install" class="install-dock"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Propelr needs JavaScript. The full course text is also in <a href="classic.html">the classic version</a>.</p></noscript>

  <script src="assets/app.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/adapt.js"></script>
  <script src="assets/baseline.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/video.js"></script>
  <script src="assets/lesson.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
    var TIER_KEYS = ["novice", "beginner", "intermediate", "advanced"];
    var CONCEPTS = ["apis", "web", "data", "diagrams", "wireframes", "stories", "agile"];
    var appWired = false;

    // ---- theme (sun/moon toggle) ----
    (function () {
      var root = document.documentElement, btn = document.getElementById("themeBtn");
      var saved = null; try { saved = localStorage.getItem("px_theme"); } catch (e) {}
      if (saved) root.setAttribute("data-theme", saved);
      function current() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
      function updateThemeBtn() {
        var isDark = current() === "dark";
        btn.innerHTML = PX.icon(isDark ? "sun" : "moon");   // show the mode you'll switch TO
        btn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        btn.setAttribute("title", isDark ? "Light mode" : "Dark mode");
      }
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("px_theme", next); } catch (e) {}
        updateThemeBtn();
      });
      updateThemeBtn();
    })();

    PXStore.init().then(function () {
      setOffline(!navigator.onLine);
      window.addEventListener("online", function () { setOffline(false); });
      window.addEventListener("offline", function () { setOffline(true); });
      document.getElementById("profileBtn").addEventListener("click", function () { location.hash = "#/profile"; });
      document.getElementById("levelBadge").addEventListener("click", function () { location.hash = "#/levels"; });

      if (!PXAuth.session()) { renderLogin(); return; }   // invite-only gate
      startApp();
    });

    function startApp() {
      document.body.classList.add("authed");
      refreshProfileButton();
      PXPWA.init();
      Adapt.startSession();                       // streak + long-gap recall check
      buildMenu();
      evaluateBadges();                           // catch streak / placement / topic badges from prior sessions
      if (!appWired) { Adapt.on(onDirective); window.addEventListener("hashchange", route); appWired = true; }
      // First thing after login: if you haven't taken the placement test, go straight to it.
      // Returning learners land back where they were.
      var target = !PXStore.state.baseline ? "#/baseline"
        : (location.hash && location.hash !== "#/login" ? location.hash : "#/");
      if (location.hash !== target) location.hash = target; else route();
    }

    function refreshProfileButton() {
      var s = PXAuth.session(); if (!s) return;
      var av = s.avatar ? '<img class="avatar__img" src="' + s.avatar + '" alt="">' : PXAuth.initials();
      document.getElementById("profileBtn").innerHTML = '<span class="avatar" aria-hidden="true">' + av + '</span><span>' + (s.name || s.email) + '</span>';
    }

    function setOffline(v) { document.body.classList.toggle("is-offline", !!v); }
    function tierIdx() { return Math.max(0, TIER_KEYS.indexOf(Adapt.tier())); }

    // ---- Menu dropdown ----
    var menuBuilt = false, menuOpen = false;
    var MENU = [
      ["Explore", null, null, null],
      ["#/roadmap", "map", "Roadmap", "The whole path, and how far you are"],
      ["#/how", "book", "How Propelr works", "A one-minute guide"],
      ["#/flashcards", "cards", "Flashcards", "Quick recall per topic"],
      ["#/showcase", "share", "Share a project", "Post to the Showcase"],
      ["You", null, null, null],
      ["#/levels", "trophy", "Levels", "Your rank & points"],
      ["#/badges", "award", "Badges", "What you’ve earned"],
      ["#/profile", "user", "My profile", null],
      ["#/baseline", "refresh", "Retake placement", null]
    ];
    function buildMenu() {
      if (menuBuilt) { syncMenuTier(); return; }
      menuBuilt = true;
      var btn = document.getElementById("menuBtn");
      btn.innerHTML = PX.icon("menu") + "Menu" + PX.icon("chevron");
      var panel = document.getElementById("menuPanel");
      var html = MENU.map(function (it) {
        if (it[1] === null) return '<p class="menu__label">' + it[0] + '</p>';
        return '<a class="menu__item" role="menuitem" href="' + it[0] + '">' + PX.icon(it[1]) +
          '<span><b>' + it[2] + '</b>' + (it[3] ? '<span class="menu__sub">' + it[3] + '</span>' : '') + '</span></a>';
      }).join("");
      html += '<div class="menu__row"><span class="menu__k">Level</span><select id="menuTier" class="vspeed__sel" aria-label="Your level"></select></div>';
      html += '<hr class="menu__sep"><button class="menu__item" role="menuitem" id="menuLogout" type="button">' + PX.icon("logout") + '<span><b>Log out</b></span></button>';
      panel.innerHTML = html;
      syncMenuTier();
      document.getElementById("menuTier").addEventListener("change", function () { Adapt.setTier(this.value, { overridden: true }); route(); });
      panel.querySelectorAll(".menu__item[href]").forEach(function (a) { a.addEventListener("click", closeMenu); });
      document.getElementById("menuLogout").addEventListener("click", function () { closeMenu(); PXAuth.logout().then(function () { document.body.classList.remove("authed"); renderLogin(); }); });
      btn.addEventListener("click", function (e) { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); });
      document.addEventListener("click", function (e) { if (menuOpen && !document.getElementById("menuWrap").contains(e.target)) closeMenu(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menuOpen) { closeMenu(); btn.focus(); } });
    }
    function openMenu() {
      menuOpen = true;
      var panel = document.getElementById("menuPanel"), btn = document.getElementById("menuBtn");
      panel.hidden = false;
      // On the mobile full-width sheet, sit just below the (possibly wrapped) app bar.
      if (window.matchMedia("(max-width: 520px)").matches) panel.style.top = (btn.getBoundingClientRect().bottom + 8) + "px";
      else panel.style.top = "";
      btn.setAttribute("aria-expanded", "true");
    }
    function closeMenu() { menuOpen = false; var p = document.getElementById("menuPanel"); if (p) p.hidden = true; var b = document.getElementById("menuBtn"); if (b) b.setAttribute("aria-expanded", "false"); }
    function syncMenuTier() {
      var s = document.getElementById("menuTier"); if (!s) return;
      s.innerHTML = TIER_KEYS.map(function (k) { return '<option value="' + k + '"' + (k === Adapt.tier() ? " selected" : "") + ">" + Adapt.LABEL[k] + "</option>"; }).join("");
    }

    // ---- global directive handling (fires from Adapt across screens) ----
    function card(cls, title, body, actions) {
      var d = document.createElement("div"); d.className = "directive " + cls;
      d.innerHTML = '<div class="directive__h">' + title + '</div>' + (body ? '<div class="directive__b">' + body + '</div>' : '') + (actions ? '<div class="row">' + actions + '</div>' : '');
      return d;
    }
    function onDirective(d) {
      if (d.type === "tierChanged") { syncMenuTier(); if (PX.toast) PX.toast("Level: " + Adapt.LABEL[d.tier] + (d.overridden ? " (you set this)" : " (stepped up)"), { duration: 2200 }); }
      if (d.type === "recallCheck") {
        var cst = PXStore.state; cst.stats = cst.stats || {}; if (!cst.stats.comeback) { cst.stats.comeback = true; PXStore.save(); } evaluateBadges();
        var r = document.getElementById("recall"); if (!r) return;
        r.innerHTML = "";
        var el = card("directive--recall", "Welcome back", "It’s been " + d.gapDays + " days. Want a 30-second refresher before you carry on? No pressure — jump straight in if you’d rather.",
          '<button class="btn btn--sm" data-skip type="button">Sounds good</button><button class="btn btn--ghost btn--sm" data-skip type="button">Skip</button>');
        el.style.margin = "var(--s3) 0";
        r.appendChild(el);
        r.querySelectorAll("[data-skip]").forEach(function (b) { b.addEventListener("click", function () { r.innerHTML = ""; }); });
      }
      if (d.type === "offerStepUp") {
        var slot = document.getElementById("directives"); if (!slot) return;
        var up = card("directive--up", (PX.icon ? PX.icon("spark") : "") + " You’re flying — ready for harder?",
          "Two clean answers in a row. Step up to <b>" + Adapt.LABEL[d.to] + "</b> for less scaffolding and tougher transfer tasks. Drop back anytime.",
          '<button class="btn btn--sm" data-accept type="button">Step up</button><button class="btn btn--ghost btn--sm" data-no type="button">Not yet</button>');
        up.querySelector("[data-accept]").addEventListener("click", function () { Adapt.acceptStepUp(d.to); up.remove(); route(); });
        up.querySelector("[data-no]").addEventListener("click", function () { up.remove(); });
        slot.appendChild(up);
      }
      if (d.type === "remediation") {
        var s2 = document.getElementById("directives"); if (!s2) return;
        s2.appendChild(card("directive--rem", (PX.icon ? PX.icon("check") : "") + " Let’s build that up a step",
          "Here’s the same idea broken smaller — a quick worked example from the ground up, then we’ll try again.", ""));
      }
      if (d.type === "surfaceAlt") {
        var a = document.getElementById("altSlot"); if (!a) return;
        a.innerHTML = ""; a.appendChild(card("directive--alt", "Prefer to read it?", "You’ve replayed that part a few times — here’s the same idea in text, no video needed.", ""));
      }
    }

    // ---- router ----
    function route() {
      if (!PXAuth.session()) return renderLogin();
      var h = location.hash || "#/";
      var m = h.match(/^#\/c\/(\w+)/);
      var fc = h.match(/^#\/fc\/(\w+)/);
      if (h === "#/profile") return renderProfile();
      if (h === "#/baseline") return renderBaseline();
      if (h === "#/roadmap") return renderRoadmap();
      if (h === "#/how") return renderHow();
      if (h === "#/showcase") return renderShowcase();
      if (h === "#/levels") return renderLevels();
      if (h === "#/badges") return renderBadges();
      if (h === "#/flashcards") return renderFlashcards();
      if (fc && CONCEPTS.indexOf(fc[1]) >= 0) return renderFlashcardsFor(fc[1]);
      if (m && CONCEPTS.indexOf(m[1]) >= 0) return renderConcept(m[1]);
      return renderHome();
    }
    function view() { var v = document.getElementById("view"); v.innerHTML = ""; return v; }
    function focusView() { var v = document.getElementById("view"); try { v.focus({ preventScroll: true }); } catch (e) {} }

    // A topic is complete when its milestones are met: a correct first-try answer,
    // plus (if the topic has a video) watching at least half of it.
    function hasPrimaryVideo(id) { return PXContent.CONCEPTS[id].blocks.some(function (b) { return b.role === "video" && b.kind === "primary"; }); }
    function topicMax(id) { return hasPrimaryVideo(id) ? 2 : 1; }
    function mastery(id) {
      var c = (Adapt.snapshot().concepts[id]) || {};
      var m = 0;
      if (hasPrimaryVideo(id) && c.video && c.video.watchedPct >= 50) m++;
      if (c.firstTry && c.firstTry.some(function (x) { return x; })) m++;
      return m;
    }
    function topicDone(id) { return mastery(id) >= topicMax(id); }
    function topicPct(id) { return Math.round(mastery(id) / topicMax(id) * 100); }

    // ---- Badges — a perpetual, category-based system (100+ and growing) ----
    var BADGE_CATS = [
      { key: "levels", label: "Getting started", icon: "spark" },
      { key: "videos", label: "Videos", icon: "book" },
      { key: "topics", label: "Topics", icon: "check" },
      { key: "cards", label: "Flashcards", icon: "cards" },
      { key: "practice", label: "Practice", icon: "check" },
      { key: "streaks", label: "Streaks", icon: "flame" },
      { key: "projects", label: "Projects", icon: "share" },
      { key: "explore", label: "Exploration", icon: "map" },
      { key: "consistency", label: "Consistency", icon: "refresh" },
      { key: "milestones", label: "Milestones", icon: "award" }
    ];
    function catIcon(key) { for (var i = 0; i < BADGE_CATS.length; i++) if (BADGE_CATS[i].key === key) return BADGE_CATS[i].icon; return "award"; }

    function buildBadges() {
      var B = [];
      function series(metric, cat, defs, fmt) {
        defs.forEach(function (d) {
          B.push({ id: metric + "_" + d[0], cat: cat, tier: d[2] || "small", name: d[1], desc: fmt ? fmt(d[0]) : d[0] + "", check: (function (n) { return function (s) { return (s[metric] || 0) >= n; }; })(d[0]) });
        });
      }
      // Levels / getting started
      B.push({ id: "lvl_placed", cat: "levels", tier: "small", name: "First steps", desc: "Finished your placement", check: function (s) { return s.placed; } });
      B.push({ id: "lvl_beg", cat: "levels", tier: "small", name: "Beginner", desc: "Reached the Beginner level", check: function (s) { return s.tierRank >= 1; } });
      B.push({ id: "lvl_int", cat: "levels", tier: "small", name: "Intermediate", desc: "Reached the Intermediate level", check: function (s) { return s.tierRank >= 2; } });
      B.push({ id: "lvl_adv", cat: "levels", tier: "big", name: "Advanced", desc: "Reached the Advanced level", check: function (s) { return s.tierRank >= 3; } });
      // Videos
      series("videos", "videos", [[1, "Pressed play", "small"], [3, "Getting into it", "small"], [5, "Regular viewer", "small"], [10, "Ten under the belt", "small"], [15, "Screen time", "small"], [25, "Binge learner", "big"], [40, "Film buff", "big"], [60, "Marathon watcher", "big"], [80, "Screening room", "big"], [100, "Century of videos", "big"]], function (n) { return n + " videos finished"; });
      // Topics
      series("topics", "topics", [[1, "Topic cleared", "small"], [2, "Two down", "small"], [3, "Foundations", "small"], [5, "Well rounded", "big"], [7, "Full sweep", "big"], [10, "Ten topics", "big"], [15, "Encyclopedic", "big"], [20, "Scholar", "big"]], function (n) { return n + " topics completed"; });
      CONCEPTS.forEach(function (id) { B.push({ id: "topic_" + id, cat: "topics", tier: "small", name: PXContent.CONCEPTS[id].title, desc: "Completed “" + PXContent.CONCEPTS[id].area + "”", check: (function (cid) { return function () { return topicDone(cid); }; })(id) }); });
      // Flashcards
      series("cards", "cards", [[10, "Flipper", "small"], [25, "Card sharp", "small"], [50, "Fifty cards", "small"], [100, "Century of cards", "big"], [200, "Card master", "big"], [350, "Recall pro", "big"], [500, "Memory bank", "big"], [750, "Near-total recall", "big"], [1000, "Thousand cards", "big"]], function (n) { return n + " cards reviewed"; });
      series("decks", "cards", [[1, "First deck", "small"], [3, "Three decks", "small"], [5, "Five decks", "big"], [7, "Deck sweep", "big"], [10, "Deck master", "big"]], function (n) { return n + " decks completed"; });
      // Practice
      series("correct", "practice", [[1, "First correct", "small"], [5, "Five right", "small"], [10, "Ten right", "small"], [25, "Sharp shooter", "small"], [50, "Fifty right", "big"], [100, "Sharpshooter", "big"], [200, "Marksman", "big"], [300, "Dead-eye", "big"], [500, "Five hundred right", "big"], [750, "Prolific", "big"]], function (n) { return n + " correct answers"; });
      series("cleanBest", "practice", [[2, "Clean sweep", "small"], [3, "Three clean", "small"], [5, "Flawless five", "small"], [8, "Eight clean", "big"], [10, "Ten clean", "big"], [15, "Untouchable", "big"]], function (n) { return n + " clean answers in a row"; });
      // Streaks
      series("streak", "streaks", [[2, "Back again", "small"], [3, "On a roll", "small"], [5, "Five in a row", "small"], [7, "A full week", "small"], [10, "Ten days", "small"], [14, "Fortnight", "big"], [21, "Habit formed", "big"], [30, "A month straight", "big"], [50, "Unstoppable", "big"], [75, "Iron will", "big"], [100, "Centurion", "big"], [150, "Relentless", "big"], [200, "Devoted", "big"], [365, "A whole year", "big"]], function (n) { return "A " + n + "-day streak"; });
      // Projects
      series("posts", "projects", [[1, "Shipped it", "small"], [3, "Builder", "small"], [5, "Prolific maker", "small"], [10, "Ten projects", "big"], [15, "Maker", "big"], [25, "Showcase star", "big"], [50, "Fifty shipped", "big"]], function (n) { return n + " projects shared"; });
      // Exploration (hints + rewinds)
      series("hints", "explore", [[1, "Not afraid to ask", "small"], [5, "Curious", "small"], [10, "Inquisitive", "small"], [25, "Question everything", "small"]], function (n) { return n + " hints used"; });
      series("rewatches", "explore", [[1, "Second look", "small"], [5, "Rewinder", "small"], [10, "Watch again", "small"], [25, "On repeat", "small"]], function (n) { return n + " rewinds"; });
      // Consistency (visits + time of day)
      series("visits", "consistency", [[1, "Welcome", "small"], [5, "Making it a habit", "small"], [10, "Ten visits", "small"], [25, "Regular", "big"], [50, "Devotee", "big"], [100, "Hundred visits", "big"]], function (n) { return n + " visits"; });
      B.push({ id: "time_early", cat: "consistency", tier: "small", name: "Early bird", desc: "Learned before 8am", check: function (s) { return s.early; } });
      B.push({ id: "time_night", cat: "consistency", tier: "small", name: "Night owl", desc: "Learned after 11pm", check: function (s) { return s.night; } });
      B.push({ id: "time_weekend", cat: "consistency", tier: "small", name: "Weekend warrior", desc: "Learned on a weekend", check: function (s) { return s.weekend; } });
      B.push({ id: "time_comeback", cat: "consistency", tier: "small", name: "Comeback", desc: "Returned after a break", check: function (s) { return s.comeback; } });
      // Milestones (meta — earned badges)
      series("earnedCount", "milestones", [[5, "Collector", "small"], [10, "Badge hunter", "small"], [25, "Decorated", "big"], [50, "Hall of fame", "big"], [75, "Legendary", "big"], [100, "Completionist", "big"]], function (n) { return n + " badges earned"; });
      return B;
    }
    var BADGES = buildBadges();

    function badgeStats() {
      var st = PXStore.state, cs = st.concepts || {};
      var videos = 0, cleanBest = 0, topics = 0, correct = 0, hints = 0, rewatches = 0;
      Object.keys(cs).forEach(function (id) {
        var c = cs[id];
        if (c.video && c.video.ended) videos += c.video.ended;
        if ((c.consecClean || 0) > cleanBest) cleanBest = c.consecClean;
        if (c.firstTry) correct += c.firstTry.filter(function (x) { return x; }).length;
        hints += (c.hintsTotal || 0);
        rewatches += (c.seekBacks || 0);
      });
      CONCEPTS.forEach(function (id) { if (topicDone(id)) topics++; });
      var stats = st.stats || {};
      var posts = (st.posts || []).filter(function (p) { return PXAuth.mine(p); }).length;
      var visits = 0; try { visits = parseInt(localStorage.getItem("px_visits") || "0", 10); } catch (e) {}
      var now = new Date(), hr = now.getHours(), day = now.getDay();
      var tierRank = TIER_KEYS.indexOf(Adapt.tier()); if (tierRank < 0) tierRank = 1;
      return {
        placed: !!st.baseline, videos: videos, topics: topics, streak: (st.session && st.session.streak) || 0,
        cleanBest: cleanBest, posts: posts, cards: stats.cardsFlipped || 0, decks: stats.decks ? Object.keys(stats.decks).length : 0,
        correct: correct, hints: hints, rewatches: rewatches, visits: visits, comeback: !!stats.comeback,
        earnedCount: Object.keys(st.badges || {}).length, tierRank: tierRank,
        early: hr < 8, night: hr >= 23 || hr < 5, weekend: day === 0 || day === 6
      };
    }
    function playBadgeSound(kind) {
      if (document.querySelector(".celebrate") || document.querySelector(".levelup")) return;   // celebration/level-up music takes precedence
      try { var a = new Audio("assets/audio/badge-" + kind + ".mp3"); a.volume = 0.75; a.play().catch(function () {}); } catch (e) {}
    }
    function evaluateBadges() {
      var st = PXStore.state; st.badges = st.badges || {};
      var s = badgeStats(), newly = [];
      BADGES.forEach(function (b) { if (!st.badges[b.id] && b.check(s)) { st.badges[b.id] = Date.now(); newly.push(b); } });
      if (newly.length) {
        PXStore.save();
        var big = newly.some(function (b) { return b.tier === "big"; });
        playBadgeSound(big ? "big" : "small");   // big sound for significant badges, small otherwise
        newly.slice(0, 3).forEach(function (b) { if (PX.toast) PX.toast((b.tier === "big" ? "🏆" : "🏅") + " Badge earned — " + b.name, { duration: 3200 }); });
        if (newly.length > 3 && PX.toast) PX.toast("🎉 +" + (newly.length - 3) + " more badges", { duration: 2600 });
      }
      evaluateLevel();   // badges feed points, so check the level right after
      return newly;
    }

    function evaluateProgress() { return evaluateBadges(); }   // badges → which also checks the level

    // ---- Levels — points-driven, escalating thresholds (Rabbit → Dragon) ----
    var LEVEL_NAMES = ["Rabbit", "Fox", "Wolf", "Lynx", "Black Panther", "Bear", "Lion", "Tiger", "Rhinoceros", "Woolly Mammoth", "Griffin", "Cerberus", "Kraken", "Phoenix", "Dragon"];
    var MAX_LEVEL = LEVEL_NAMES.length, L_BASE = 500, L_MULT = 1.4;   // gap grows ×1.4 each level (not surfaced in the UI)
    function levelName(L) { return LEVEL_NAMES[Math.min(Math.max(L, 1), MAX_LEVEL) - 1] || ("Level " + L); }
    function levelIconSrc(L) { return "assets/levels/level-" + Math.min(Math.max(L, 1), MAX_LEVEL) + ".png"; }
    function levelGap(n) { return Math.round(L_BASE * Math.pow(L_MULT, n - 1)); }          // points from level n → n+1

      v.appendChild(h);
      var items = [
        ["refresh", "It meets you at your level", "A quick placement sets your starting point. Lessons adjust — more guidance at Novice, problem-first at Advanced. Change your level any time from the Menu."],
        ["book", "Watch, then try", "Each topic opens with a short video (under ten minutes), then a quick check and a task to apply it to your own work."],
        ["map", "Go deeper when you want", "In-depth videos, code walkthroughs and source links sit quietly under each lesson — open them only if you want them."],
        ["cards", "Lock it in with flashcards", "Finish a topic and its flashcards unlock, for fast recall later."],
        ["share", "Share what you build", "Post projects to the Showcase and see what others are making."],
        ["user", "Yours, across devices", "Add it to your home screen, use it offline, and your progress syncs when you’re back online."]
      ];
      var wrap = document.createElement("div"); wrap.className = "how";
      items.forEach(function (it) { var d = document.createElement("div"); d.className = "how__item"; d.innerHTML = '<span class="how__ic">' + PX.icon(it[0]) + '</span><div><h3>' + it[1] + '</h3><p>' + it[2] + '</p></div>'; wrap.appendChild(d); });
      v.appendChild(wrap); focusView();
    }

    // Every field here is required — a submission only counts (and earns points) when it’s complete.
    var SC_REQS = [
      { key: "title", label: "Title", ph: "The name of your project", ml: 120 },
      { key: "problem", label: "The problem it solves", area: true, ph: "What need does it address?" },
      { key: "built", label: "What you built", area: true, ph: "What does it actually do?" },
      { key: "tech", label: "Technology used", ph: "e.g. Figma, React, Supabase, Zapier" },
      { key: "who", label: "Who it’s for", ph: "The people who’d use it" },
      { key: "learned", label: "What you learned", area: true, ph: "One thing this taught you" },
      { key: "link", label: "A project link", ph: "https://… (at least one)", url: true }
    ];
    function renderShowcase() {
      var v = view(); crumb(v, "showcase");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Share a project</h1><p class="reading muted">A submission counts once it’s complete — fill every field below. Complete projects earn the most points.</p>';
      v.appendChild(h);

      var form = document.createElement("form"); form.className = "sc-form"; form.setAttribute("novalidate", "");
      var checkHtml = '<p class="data">what a submission needs</p><div class="sc-check" id="scCheck"></div>';
      var fieldsHtml = SC_REQS.map(function (r) {
        var input = r.area
          ? '<textarea id="sc-' + r.key + '" placeholder="' + r.ph + '"></textarea>'
          : '<input class="input" id="sc-' + r.key + '" type="text"' + (r.url ? ' inputmode="url"' : '') + (r.ml ? ' maxlength="' + r.ml + '"' : '') + ' placeholder="' + r.ph + '">';
        return '<label class="field"><span class="field__l">' + r.label + '</span>' + input + '</label>';
      }).join("");
      form.innerHTML = checkHtml + fieldsHtml +
        '<p class="auth-msg" id="scMsg" role="status"></p>' +
        '<button class="btn" id="scBtn" type="submit" style="margin-top:var(--s3)" disabled>Submit project' + PX.icon("send", "btn__i") + '</button>';
      v.appendChild(form);
      var list = document.createElement("div"); list.className = "sc-list"; v.appendChild(list);

      function val(key) { var el = document.getElementById("sc-" + key); return el ? el.value.trim() : ""; }
      function met(r) { var x = val(r.key); return r.url ? !!safeUrl(/^https?:\/\//i.test(x) ? x : "https://" + x) : x.length > 0; }
      function refreshChecks() {
        var all = true;
        document.getElementById("scCheck").innerHTML = SC_REQS.map(function (r) {
          var ok = met(r); if (!ok) all = false;
          return '<div class="sc-check__i' + (ok ? " is-ok" : "") + '"><span class="sc-check__dot">' + (ok ? PX.icon("check") : "") + '</span>' + r.label + '</div>';
        }).join("");
        document.getElementById("scBtn").disabled = !all;
        return all;
      }
      SC_REQS.forEach(function (r) { var el = document.getElementById("sc-" + r.key); if (el) el.addEventListener("input", refreshChecks); });
      refreshChecks();

      function paint(posts) {
        list.innerHTML = "";
        if (!posts || !posts.length) { list.innerHTML = '<div class="sc-empty">No projects yet — be the first to share one.</div>'; return; }
        posts.forEach(function (p) {
          var card = document.createElement("div"); card.className = "sc-post";
          var u = safeUrl(p.link);
          var meta = "";
          if (p.fields) {
            meta = '<dl class="sc-meta">' +
              (p.fields.problem ? '<dt>Problem</dt><dd>' + escapeHtml(p.fields.problem) + '</dd>' : '') +
              (p.fields.built ? '<dt>What it does</dt><dd>' + escapeHtml(p.fields.built) + '</dd>' : '') +
              (p.fields.tech ? '<dt>Tech</dt><dd>' + escapeHtml(p.fields.tech) + '</dd>' : '') +
              (p.fields.who ? '<dt>For</dt><dd>' + escapeHtml(p.fields.who) + '</dd>' : '') +
              (p.fields.learned ? '<dt>Learned</dt><dd>' + escapeHtml(p.fields.learned) + '</dd>' : '') +
              '</dl>';
          } else if (p.body) { meta = '<p class="muted" style="margin:0;white-space:pre-line">' + escapeHtml(p.body) + '</p>'; }
          var link = u ? '<a class="sc-post__link" href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">Open project ↗</a>' : '';
          card.innerHTML = '<div class="sc-post__top"><span class="data sc-post__by">' + escapeHtml(p.name || "Someone") + '</span></div>' +
            '<h3>' + escapeHtml(p.title || "") + '</h3>' + meta + link;
          if (PXAuth.mine(p)) {
            var rm = document.createElement("button"); rm.className = "btn btn--ghost btn--sm"; rm.type = "button"; rm.textContent = "Delete"; rm.style.marginTop = "var(--s2)";
            rm.addEventListener("click", function () { PXAuth.deletePost(p.id).then(load); });
            card.appendChild(rm);
          }
          list.appendChild(card);
        });
      }
      function load() { PXAuth.listPosts().then(paint); }
      load();

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("scMsg"), btn = document.getElementById("scBtn");
        if (!refreshChecks()) { msg.textContent = "Complete every field above to submit."; msg.className = "auth-msg is-err"; return; }
        var f = {}; SC_REQS.forEach(function (r) { f[r.key] = val(r.key); });
        var link = /^https?:\/\//i.test(f.link) ? f.link : "https://" + f.link;
        var body = "Problem: " + f.problem + "\nWhat it does: " + f.built + "\nTech: " + f.tech + "\nFor: " + f.who + "\nLearned: " + f.learned;
        var fields = { problem: f.problem, built: f.built, tech: f.tech, who: f.who, learned: f.learned };
        btn.disabled = true; btn.textContent = "Submitting…"; msg.textContent = ""; msg.className = "auth-msg";
        PXAuth.addPost({ title: f.title, body: body, link: link, kind: "project", fields: fields, valid: true }).then(function (res) {
          form.reset(); refreshChecks();
          btn.innerHTML = "Submit project" + PX.icon("send", "btn__i");
          msg.textContent = res && res.synced === false ? "Submitted on this device — it’ll sync when you’re online." : "Project submitted! 🎉"; msg.className = "auth-msg is-ok";
          evaluateProgress();                     // "Shipped it" badge + project points
          load();
        });
      });
      focusView();
    }

    function renderFlashcards() {
      var v = view(); crumb(v, "flashcards");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Flashcards</h1><p class="reading muted">Quick recall for each topic. A topic’s cards unlock once you’ve finished that topic.</p>';
      v.appendChild(h);
      var grid = document.createElement("div"); grid.className = "fc-grid";
      CONCEPTS.forEach(function (id) {
        var c = PXContent.CONCEPTS[id]; var cards = PXContent.FLASHCARDS[id] || []; var unlocked = topicDone(id);
        var el = document.createElement("div"); el.className = "fc-topic" + (unlocked ? "" : " is-locked");
        el.innerHTML = '<span class="data concept-card__area">' + c.area + '</span><h3 style="margin:0">' + c.title + '</h3><p class="muted" style="margin:0">' + cards.length + ' cards</p>';
        if (unlocked) { var go = document.createElement("a"); go.className = "btn btn--sm"; go.href = "#/fc/" + id; go.style.marginTop = "var(--s2)"; go.textContent = "Study"; el.appendChild(go); }
        else { var lock = document.createElement("span"); lock.className = "fc-topic__lock"; lock.style.marginTop = "var(--s2)"; lock.innerHTML = PX.icon("lock") + "Finish the topic to unlock"; el.appendChild(lock); }
        grid.appendChild(el);
      });
      v.appendChild(grid); focusView();
    }

    function renderFlashcardsFor(id) {
      var cards = PXContent.FLASHCARDS[id] || [];
      if (!cards.length || !topicDone(id)) { location.hash = "#/flashcards"; return; }
      var v = view();
      crumb(v, PXContent.CONCEPTS[id].area, "#/flashcards", "Flashcards");
      var h = document.createElement("h1"); h.className = "t-h1"; h.style.margin = "var(--s3) 0 0"; h.textContent = PXContent.CONCEPTS[id].title; v.appendChild(h);

      var i = 0, showBack = false;
      var card = document.createElement("div"); card.className = "flashcard"; card.setAttribute("role", "button"); card.setAttribute("tabindex", "0"); card.setAttribute("aria-label", "Flashcard — activate to flip");
      var nav = document.createElement("div"); nav.className = "fc-nav";
      var prev = document.createElement("button"); prev.className = "btn btn--secondary btn--sm"; prev.type = "button"; prev.textContent = "← Prev";
      var count = document.createElement("span"); count.className = "fc-count";
      var next = document.createElement("button"); next.className = "btn btn--sm"; next.type = "button"; next.textContent = "Next →";
      nav.appendChild(prev); nav.appendChild(count); nav.appendChild(next);

      function paint() {
        var c = cards[i];
        card.innerHTML = '<div class="flashcard__side"><span class="data">' + (showBack ? "answer" : "question") + '</span>' + escapeHtml(showBack ? c.a : c.q) + '</div><span class="flashcard__hint">' + (showBack ? "tap for the question" : "tap to reveal the answer") + '</span>';
        count.textContent = (i + 1) + " / " + cards.length;
        prev.disabled = i === 0; next.disabled = i === cards.length - 1;
      }
      function bumpCard() { var st = PXStore.state; st.stats = st.stats || {}; st.stats.cardsFlipped = (st.stats.cardsFlipped || 0) + 1; PXStore.save(); evaluateBadges(); }
      function markDeck() { var st = PXStore.state; st.stats = st.stats || {}; st.stats.decks = st.stats.decks || {}; if (!st.stats.decks[id]) { st.stats.decks[id] = Date.now(); PXStore.save(); evaluateBadges(); } }
      function flip() { showBack = !showBack; if (showBack) bumpCard(); paint(); if (i === cards.length - 1) markDeck(); }
      card.addEventListener("click", flip);
      card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
      prev.addEventListener("click", function () { if (i > 0) { i--; showBack = false; paint(); } });
      next.addEventListener("click", function () { if (i < cards.length - 1) { i++; showBack = false; paint(); if (i === cards.length - 1) markDeck(); } });
      v.appendChild(card); v.appendChild(nav);
      paint(); focusView();
    }

    function renderLevels() {
      evaluateBadges();   // refresh points/level
      var v = view(); crumb(v, "levels");
      var info = levelInfo();
      var head = document.createElement("div");
      head.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Your level</h1>';
      v.appendChild(head);

      var hero = document.createElement("div"); hero.className = "lvhero";
      hero.innerHTML =
        '<img class="lvhero__icon" src="' + levelIconSrc(info.level) + '" alt="' + escapeHtml(info.name) + '">' +
        '<div class="lvhero__body"><p class="data">level ' + info.level + '</p><h2 style="margin:2px 0 0">' + escapeHtml(info.name) + '</h2>' +
        '<p class="muted" style="margin:6px 0 0"><b>' + info.points + '</b> points</p></div>';
      v.appendChild(hero);

      var prog = document.createElement("div"); prog.className = "card"; prog.style.marginTop = "var(--s4)";
      if (info.atMax) {
        prog.innerHTML = '<p class="data">top level</p><p class="reading muted" style="margin-top:var(--s2)">You’ve reached the summit — <b>' + escapeHtml(info.name) + '</b>. Nothing left to climb.</p>';
      } else {
        prog.innerHTML =
          '<div class="between"><span class="data">progress to ' + escapeHtml(info.next) + '</span><span class="data"><b>' + info.toNext + '</b> points to go</span></div>' +
          '<div class="lvbar" style="margin-top:var(--s2)"><span class="lvbar__fill" style="width:' + info.pct + '%"></span></div>' +
          '<div class="lvnext" style="margin-top:var(--s4)"><img src="' + levelIconSrc(info.level + 1) + '" alt=""><div><p class="data">up next</p><b>' + escapeHtml(info.next) + '</b></div></div>';
      }
      v.appendChild(prog);

      var how = document.createElement("div"); how.className = "card"; how.style.marginTop = "var(--s5)";
      var ptsRows = [
        ["Submit a complete project", "300", "the most"],
        ["Complete a topic", "150", ""],
        ["Finish a flashcard deck", "60", ""],
        ["Finish a video", "40", ""],
        ["Earn a badge", "25", ""],
        ["Answer correctly", "10", ""],
        ["Daily streak", "10 / day", "the least"]
      ];
      how.innerHTML = '<p class="data">how points work</p>' +
        '<p class="reading muted" style="margin:var(--s2) 0 var(--s3)">Rack these up to reach the next level. Streaks add a bonus at every 5-day run.</p>' +
        '<dl class="pts">' + ptsRows.map(function (r) {
          return '<div class="pts__row"><dt>' + r[0] + (r[2] ? ' <span class="data muted">(' + r[2] + ')</span>' : '') + '</dt><dd class="data">+' + r[1] + '</dd></div>';
        }).join("") + '</dl>';
      v.appendChild(how);

      var lw = document.createElement("div"); lw.style.marginTop = "var(--s5)";
      lw.innerHTML = '<h2 style="font-size:1.1rem;margin:0 0 var(--s2)">All levels</h2>';
      var ladder = document.createElement("div"); ladder.className = "lvladder";
      LEVEL_NAMES.forEach(function (nm, i) {
        var L = i + 1, reached = L <= info.level;
        var el = document.createElement("div"); el.className = "lvrow" + (reached ? " is-reached" : "") + (L === info.level ? " is-current" : "");
        el.innerHTML = '<img src="' + levelIconSrc(L) + '" alt=""><span class="lvrow__n"><b>Lv ' + L + '</b> ' + escapeHtml(nm) + '</span>' +
          (reached ? '<span class="data">reached</span>' : '<span class="data muted">' + levelThreshold(L) + ' pts</span>');
        ladder.appendChild(el);
      });
      lw.appendChild(ladder); v.appendChild(lw);
      focusView();
    }

    function renderBadges() {
      evaluateBadges();
      var v = view(); crumb(v, "badges");
      var earned = PXStore.state.badges || {};
      var got = BADGES.filter(function (b) { return earned[b.id]; }).length;
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Your badges</h1>' +
        '<p class="reading muted"><b>' + got + '</b> of ' + BADGES.length + ' earned across ' + BADGE_CATS.length + ' categories. New ones keep unlocking as you go — and as new topics and projects land.</p>';
      v.appendChild(h);
      BADGE_CATS.forEach(function (cat) {
        var list = BADGES.filter(function (b) { return b.cat === cat.key; });
        if (!list.length) return;
        var ce = list.filter(function (b) { return earned[b.id]; }).length;
        var head = document.createElement("div"); head.className = "between"; head.style.marginTop = "var(--s6)";
        head.innerHTML = '<h2 style="font-size:1.1rem;margin:0">' + cat.label + '</h2><span class="data">' + ce + ' / ' + list.length + '</span>';
        v.appendChild(head);
        var grid = document.createElement("div"); grid.className = "badges";
        list.forEach(function (b) {
          var on = !!earned[b.id];
          var el = document.createElement("div"); el.className = "badge " + (on ? "is-earned" : "is-locked");
          el.innerHTML = '<span class="badge__ic">' + PX.icon(on ? catIcon(b.cat) : "lock") + '</span>' +
            '<span class="badge__name">' + b.name + '</span><span class="badge__desc">' + b.desc + '</span>';
          grid.appendChild(el);
        });
        v.appendChild(grid);
      });
      focusView();
    }
  </script>
</body>
</html>
