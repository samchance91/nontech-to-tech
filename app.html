<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Learn how software really works — adaptive, hands-on, at your level. Works offline." />
  <title>Propelr — Tech for Non-Tech People</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar__in">
      <a class="wordmark" href="#/" aria-label="Propelr home"><span class="wordmark__dot" aria-hidden="true"></span>Propelr</a>
      <div class="appbar__actions">
        <span class="offline-pill" role="status">● offline</span>
        <div class="menu needs-auth" id="menuWrap">
          <button class="btn btn--secondary btn--sm" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="menu__panel" id="menuPanel" role="menu" aria-label="Menu" hidden></div>
        </div>
        <button class="profilebtn needs-auth" id="profileBtn" type="button" aria-label="Your profile"></button>
        <button class="btn btn--secondary btn--sm iconbtn" id="themeBtn" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>

  <div id="recall" class="container" style="padding:0 var(--s4)"></div>
  <main id="view" class="container" style="padding:var(--s5) var(--s4) var(--s9)" tabindex="-1"></main>
  <div id="px-install" class="install-dock"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Propelr needs JavaScript. The full course text is also in <a href="classic.html">the classic version</a>.</p></noscript>

  <script src="assets/app.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/adapt.js"></script>
  <script src="assets/baseline.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/video.js"></script>
  <script src="assets/lesson.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
    var TIER_KEYS = ["novice", "beginner", "intermediate", "advanced"];
    var CONCEPTS = ["apis", "web", "data", "diagrams", "wireframes", "stories", "agile"];
    var appWired = false;

    // ---- theme (sun/moon toggle) ----
    (function () {
      var root = document.documentElement, btn = document.getElementById("themeBtn");
      var saved = null; try { saved = localStorage.getItem("px_theme"); } catch (e) {}
      if (saved) root.setAttribute("data-theme", saved);
      function current() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
      function updateThemeBtn() {
        var isDark = current() === "dark";
        btn.innerHTML = PX.icon(isDark ? "sun" : "moon");   // show the mode you'll switch TO
        btn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        btn.setAttribute("title", isDark ? "Light mode" : "Dark mode");
      }
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("px_theme", next); } catch (e) {}
        updateThemeBtn();
      });
      updateThemeBtn();
    })();

    PXStore.init().then(function () {
      setOffline(!navigator.onLine);
      window.addEventListener("online", function () { setOffline(false); });
      window.addEventListener("offline", function () { setOffline(true); });
      document.getElementById("profileBtn").addEventListener("click", function () { location.hash = "#/profile"; });

      if (!PXAuth.session()) { renderLogin(); return; }   // invite-only gate
      startApp();
    });

    function startApp() {
      document.body.classList.add("authed");
      refreshProfileButton();
      PXPWA.init();
      Adapt.startSession();                       // streak + long-gap recall check
      buildMenu();
      evaluateBadges();                           // catch streak / placement / topic badges from prior sessions
      if (!appWired) { Adapt.on(onDirective); window.addEventListener("hashchange", route); appWired = true; }
      // First thing after login: if you haven't taken the placement test, go straight to it.
      // Returning learners land back where they were.
      var target = !PXStore.state.baseline ? "#/baseline"
        : (location.hash && location.hash !== "#/login" ? location.hash : "#/");
      if (location.hash !== target) location.hash = target; else route();
    }

    function refreshProfileButton() {
      var s = PXAuth.session(); if (!s) return;
      var av = s.avatar ? '<img class="avatar__img" src="' + s.avatar + '" alt="">' : PXAuth.initials();
      document.getElementById("profileBtn").innerHTML = '<span class="avatar" aria-hidden="true">' + av + '</span><span>' + (s.name || s.email) + '</span>';
    }

    function setOffline(v) { document.body.classList.toggle("is-offline", !!v); }
    function tierIdx() { return Math.max(0, TIER_KEYS.indexOf(Adapt.tier())); }

    // ---- Menu dropdown ----
    var menuBuilt = false, menuOpen = false;
    var MENU = [
      ["Explore", null, null, null],
      ["#/roadmap", "map", "Roadmap", "The whole path, and how far you are"],
      ["#/how", "book", "How Propelr works", "A one-minute guide"],
      ["#/flashcards", "cards", "Flashcards", "Quick recall per topic"],
      ["#/showcase", "share", "Share a project", "Post to the Showcase"],
      ["You", null, null, null],
      ["#/badges", "award", "Badges", "What you’ve earned"],
      ["#/profile", "user", "My profile", null],
      ["#/baseline", "refresh", "Retake placement", null]
    ];
    function buildMenu() {
      if (menuBuilt) { syncMenuTier(); return; }
      menuBuilt = true;
      var btn = document.getElementById("menuBtn");
      btn.innerHTML = PX.icon("menu") + "Menu" + PX.icon("chevron");
      var panel = document.getElementById("menuPanel");
      var html = MENU.map(function (it) {
        if (it[1] === null) return '<p class="menu__label">' + it[0] + '</p>';
        return '<a class="menu__item" role="menuitem" href="' + it[0] + '">' + PX.icon(it[1]) +
          '<span><b>' + it[2] + '</b>' + (it[3] ? '<span class="menu__sub">' + it[3] + '</span>' : '') + '</span></a>';
      }).join("");
      html += '<div class="menu__row"><span class="menu__k">Level</span><select id="menuTier" class="vspeed__sel" aria-label="Your level"></select></div>';
      html += '<hr class="menu__sep"><button class="menu__item" role="menuitem" id="menuLogout" type="button">' + PX.icon("logout") + '<span><b>Log out</b></span></button>';
      panel.innerHTML = html;
      syncMenuTier();
      document.getElementById("menuTier").addEventListener("change", function () { Adapt.setTier(this.value, { overridden: true }); route(); });
      panel.querySelectorAll(".menu__item[href]").forEach(function (a) { a.addEventListener("click", closeMenu); });
      document.getElementById("menuLogout").addEventListener("click", function () { closeMenu(); PXAuth.logout().then(function () { document.body.classList.remove("authed"); renderLogin(); }); });
      btn.addEventListener("click", function (e) { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); });
      document.addEventListener("click", function (e) { if (menuOpen && !document.getElementById("menuWrap").contains(e.target)) closeMenu(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menuOpen) { closeMenu(); btn.focus(); } });
    }
    function openMenu() {
      menuOpen = true;
      var panel = document.getElementById("menuPanel"), btn = document.getElementById("menuBtn");
      panel.hidden = false;
      // On the mobile full-width sheet, sit just below the (possibly wrapped) app bar.
      if (window.matchMedia("(max-width: 520px)").matches) panel.style.top = (btn.getBoundingClientRect().bottom + 8) + "px";
      else panel.style.top = "";
      btn.setAttribute("aria-expanded", "true");
    }
    function closeMenu() { menuOpen = false; var p = document.getElementById("menuPanel"); if (p) p.hidden = true; var b = document.getElementById("menuBtn"); if (b) b.setAttribute("aria-expanded", "false"); }
    function syncMenuTier() {
      var s = document.getElementById("menuTier"); if (!s) return;
      s.innerHTML = TIER_KEYS.map(function (k) { return '<option value="' + k + '"' + (k === Adapt.tier() ? " selected" : "") + ">" + Adapt.LABEL[k] + "</option>"; }).join("");
    }

    // ---- global directive handling (fires from Adapt across screens) ----
    function card(cls, title, body, actions) {
      var d = document.createElement("div"); d.className = "directive " + cls;
      d.innerHTML = '<div class="directive__h">' + title + '</div>' + (body ? '<div class="directive__b">' + body + '</div>' : '') + (actions ? '<div class="row">' + actions + '</div>' : '');
      return d;
    }
    function onDirective(d) {
      if (d.type === "tierChanged") { syncMenuTier(); if (PX.toast) PX.toast("Level: " + Adapt.LABEL[d.tier] + (d.overridden ? " (you set this)" : " (stepped up)"), { duration: 2200 }); }
      if (d.type === "recallCheck") {
        var r = document.getElementById("recall"); if (!r) return;
        r.innerHTML = "";
        var el = card("directive--recall", "Welcome back", "It’s been " + d.gapDays + " days. Want a 30-second refresher before you carry on? No pressure — jump straight in if you’d rather.",
          '<button class="btn btn--sm" data-skip type="button">Sounds good</button><button class="btn btn--ghost btn--sm" data-skip type="button">Skip</button>');
        el.style.margin = "var(--s3) 0";
        r.appendChild(el);
        r.querySelectorAll("[data-skip]").forEach(function (b) { b.addEventListener("click", function () { r.innerHTML = ""; }); });
      }
      if (d.type === "offerStepUp") {
        var slot = document.getElementById("directives"); if (!slot) return;
        var up = card("directive--up", (PX.icon ? PX.icon("spark") : "") + " You’re flying — ready for harder?",
          "Two clean answers in a row. Step up to <b>" + Adapt.LABEL[d.to] + "</b> for less scaffolding and tougher transfer tasks. Drop back anytime.",
          '<button class="btn btn--sm" data-accept type="button">Step up</button><button class="btn btn--ghost btn--sm" data-no type="button">Not yet</button>');
        up.querySelector("[data-accept]").addEventListener("click", function () { Adapt.acceptStepUp(d.to); up.remove(); route(); });
        up.querySelector("[data-no]").addEventListener("click", function () { up.remove(); });
        slot.appendChild(up);
      }
      if (d.type === "remediation") {
        var s2 = document.getElementById("directives"); if (!s2) return;
        s2.appendChild(card("directive--rem", (PX.icon ? PX.icon("check") : "") + " Let’s build that up a step",
          "Here’s the same idea broken smaller — a quick worked example from the ground up, then we’ll try again.", ""));
      }
      if (d.type === "surfaceAlt") {
        var a = document.getElementById("altSlot"); if (!a) return;
        a.innerHTML = ""; a.appendChild(card("directive--alt", "Prefer to read it?", "You’ve replayed that part a few times — here’s the same idea in text, no video needed.", ""));
      }
    }

    // ---- router ----
    function route() {
      if (!PXAuth.session()) return renderLogin();
      var h = location.hash || "#/";
      var m = h.match(/^#\/c\/(\w+)/);
      var fc = h.match(/^#\/fc\/(\w+)/);
      if (h === "#/profile") return renderProfile();
      if (h === "#/baseline") return renderBaseline();
      if (h === "#/roadmap") return renderRoadmap();
      if (h === "#/how") return renderHow();
      if (h === "#/showcase") return renderShowcase();
      if (h === "#/badges") return renderBadges();
      if (h === "#/flashcards") return renderFlashcards();
      if (fc && CONCEPTS.indexOf(fc[1]) >= 0) return renderFlashcardsFor(fc[1]);
      if (m && CONCEPTS.indexOf(m[1]) >= 0) return renderConcept(m[1]);
      return renderHome();
    }
    function view() { var v = document.getElementById("view"); v.innerHTML = ""; return v; }
    function focusView() { var v = document.getElementById("view"); try { v.focus({ preventScroll: true }); } catch (e) {} }

    // A topic is complete when its milestones are met: a correct first-try answer,
    // plus (if the topic has a video) watching at least half of it.
    function hasPrimaryVideo(id) { return PXContent.CONCEPTS[id].blocks.some(function (b) { return b.role === "video" && b.kind === "primary"; }); }
    function topicMax(id) { return hasPrimaryVideo(id) ? 2 : 1; }
    function mastery(id) {
      var c = (Adapt.snapshot().concepts[id]) || {};
      var m = 0;
      if (hasPrimaryVideo(id) && c.video && c.video.watchedPct >= 50) m++;
      if (c.firstTry && c.firstTry.some(function (x) { return x; })) m++;
      return m;
    }
    function topicDone(id) { return mastery(id) >= topicMax(id); }
    function topicPct(id) { return Math.round(mastery(id) / topicMax(id) * 100); }

    // ---- Badges ----
    var BADGES = [
      { id: "placed", icon: "spark", name: "First steps", desc: "Finished your placement", check: function (s) { return s.placed; } },
      { id: "vid1", icon: "book", name: "Pressed play", desc: "Finished your first video", check: function (s) { return s.videos >= 1; } },
      { id: "vid5", icon: "book", name: "Binge learner", desc: "Finished five videos", check: function (s) { return s.videos >= 5; } },
      { id: "topic1", icon: "check", name: "Topic cleared", desc: "Completed your first topic", check: function (s) { return s.topics >= 1; } },
      { id: "topic3", icon: "map", name: "Foundations", desc: "Completed three topics", check: function (s) { return s.topics >= 3; } },
      { id: "topicall", icon: "award", name: "Completionist", desc: "Completed every topic", check: function (s) { return s.topics >= CONCEPTS.length; } },
      { id: "streak3", icon: "flame", name: "On a roll", desc: "A three-day streak", check: function (s) { return s.streak >= 3; } },
      { id: "streak7", icon: "flame", name: "Committed", desc: "A seven-day streak", check: function (s) { return s.streak >= 7; } },
      { id: "clean", icon: "check", name: "Sharp", desc: "Two clean answers in a row", check: function (s) { return s.cleanBest >= 2; } },
      { id: "share1", icon: "share", name: "Shipped it", desc: "Shared your first project", check: function (s) { return s.posts >= 1; } }
    ];
    function badgeStats() {
      var st = PXStore.state, cs = st.concepts || {};
      var videos = 0, cleanBest = 0, topics = 0;
      Object.keys(cs).forEach(function (id) { var c = cs[id]; if (c.video && c.video.ended) videos += c.video.ended; if ((c.consecClean || 0) > cleanBest) cleanBest = c.consecClean; });
      CONCEPTS.forEach(function (id) { if (topicDone(id)) topics++; });
      var posts = (st.posts || []).filter(function (p) { return PXAuth.mine(p); }).length;
      return { placed: !!st.baseline, videos: videos, topics: topics, streak: (st.session && st.session.streak) || 0, cleanBest: cleanBest, posts: posts };
    }
    function evaluateBadges() {
      var st = PXStore.state; st.badges = st.badges || {};
      var s = badgeStats(), newly = [];
      BADGES.forEach(function (b) { if (!st.badges[b.id] && b.check(s)) { st.badges[b.id] = Date.now(); newly.push(b); } });
      if (newly.length) { PXStore.save(); newly.forEach(function (b) { if (PX.toast) PX.toast("🏅 Badge earned — " + b.name, { duration: 3200 }); }); }
      return newly;
    }

    // ---- Session-complete celebration (topic finished) — fires once per topic, not for badges ----
    function maybeCelebrate(id) {
      var st = PXStore.state; st.celebrated = st.celebrated || {};
      if (topicDone(id) && !st.celebrated[id]) {
        st.celebrated[id] = Date.now(); PXStore.save();
        celebrate(PXContent.CONCEPTS[id].title);
      }
    }
    var celebAudio = null;
    function celebrate(title) {
      var ov = document.createElement("div"); ov.className = "celebrate"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Session complete");
      ov.innerHTML =
        '<div class="confetti" aria-hidden="true"></div>' +
        '<div class="celebrate__card">' +
          '<span class="celebrate__badge" aria-hidden="true">' + PX.icon("check") + '</span>' +
          '<p class="data">session complete</p>' +
          '<h2>Nice work!</h2>' +
          '<p class="reading muted">You’ve finished <b>' + escapeHtml(title) + '</b>. Its flashcards are unlocked.</p>' +
          '<div class="row"><button class="btn" data-close type="button">Keep going</button>' +
          '<a class="btn btn--secondary" data-close href="#/flashcards">Study the cards</a></div>' +
        '</div>';
      document.body.appendChild(ov);
      if (!PX.reduced()) {
        var cf = ov.querySelector(".confetti"), colors = ["var(--accent)", "#2C2C2C", "#FFFFFF", "#F5A623"];
        for (var i = 0; i < 44; i++) {
          var s = document.createElement("i");
          s.style.left = Math.random() * 100 + "%";
          s.style.background = colors[i % colors.length];
          s.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
          s.style.animationDelay = (Math.random() * 0.4) + "s";
          s.style.transform = "translateY(0) rotate(" + (Math.random() * 360) + "deg)";
          if (Math.random() < 0.5) s.style.borderRadius = "50%";
          cf.appendChild(s);
        }
      }
      try { celebAudio = new Audio("assets/audio/session-complete.mp3"); celebAudio.volume = 0.7; celebAudio.play().catch(function () {}); } catch (e) {}
      function close() { if (celebAudio) { try { celebAudio.pause(); } catch (e) {} } if (ov.parentNode) ov.remove(); document.removeEventListener("keydown", onKey); }
      function onKey(e) { if (e.key === "Escape") close(); }
      ov.addEventListener("click", function (e) { if (e.target === ov || (e.target.closest && e.target.closest("[data-close]"))) close(); });
      document.addEventListener("keydown", onKey);
      var b = ov.querySelector("[data-close]"); if (b) setTimeout(function () { try { b.focus(); } catch (e) {} }, 80);
    }

    function renderHome() {
      var v = view();
      var head = document.createElement("div");
      head.className = "stack";
      head.innerHTML =
        '<p class="data">your topics</p>' +
        '<h1 class="t-h1" style="margin:4px 0 0">Pick a topic to learn</h1>' +
        '<p class="reading muted" style="margin-top:var(--s2)">You’re set to <b>' + Adapt.tierLabel() + '</b> — every lesson adjusts to that. Tap a topic to begin.</p>';
      v.appendChild(head);

      var grid = document.createElement("div"); grid.className = "conceptgrid";
      CONCEPTS.forEach(function (id) {
        var c = PXContent.CONCEPTS[id]; var pc = topicPct(id);
        var b = document.createElement("button"); b.className = "concept-card"; b.type = "button";
        b.innerHTML =
          '<p class="data concept-card__area">' + c.area + '</p>' +
          '<h3 style="margin:0">' + c.title + '</h3>' +
          '<div class="concept-card__meta"><span class="concept-card__bar"><span class="concept-card__fill" style="--p:' + pc + '%"></span></span>' +
          '<span class="data">' + (pc === 100 ? "done" : pc ? pc + "%" : "start") + '</span></div>';
        b.addEventListener("click", function () { location.hash = "#/c/" + id; });
        grid.appendChild(b);
      });
      v.appendChild(grid);

      var foot = document.createElement("p"); foot.className = "reading muted"; foot.style.marginTop = "var(--s6)";
      foot.innerHTML = 'Want to reset your starting level? <a href="#/baseline">Retake the 2-minute placement</a>.';
      v.appendChild(foot);
      focusView();
    }

    function renderBaseline() {
      var v = view();
      var mount = document.createElement("div"); v.appendChild(mount);   // the baseline renders its own intro — no extra heading
      PX.Baseline(mount, { onDone: function (tier) {
        // bridge baseline result into the live store + engine
        PXStore.state.baseline = { tier: tier.key, at: Date.now() };
        Adapt.setTier(tier.key, { overridden: false });
        PXStore.save();
        syncMenuTier();
        evaluateBadges();                         // "First steps" for finishing placement
        location.hash = "#/";
      } });
      focusView();
    }

    function renderConcept(id) {
      var v = view();
      var c = PXContent.CONCEPTS[id];
      var bar = document.createElement("div"); bar.className = "between";
      bar.innerHTML = '<a class="btn btn--ghost btn--sm" href="#/">← Topics</a><span class="data">' + c.area + '</span>';
      v.appendChild(bar);
      var h = document.createElement("h1"); h.className = "t-h1"; h.style.margin = "var(--s3) 0 var(--s2)"; h.textContent = c.title; v.appendChild(h);

      var dir = document.createElement("div"); dir.id = "directives"; dir.setAttribute("aria-live", "polite"); v.appendChild(dir);
      var alt = document.createElement("div"); alt.id = "altSlot"; v.appendChild(alt);

      var mount = document.createElement("div"); mount.style.marginTop = "var(--s4)"; v.appendChild(mount);
      PXLesson.render(mount, id, tierIdx(), { onSignal: function () { evaluateBadges(); maybeCelebrate(id); } });

      var foot = document.createElement("div"); foot.className = "section";
      var back = document.createElement("a"); back.className = "btn btn--secondary"; back.href = "#/"; back.innerHTML = "Back to topics" + (PX.icon ? PX.icon("arrowR", "btn__i") : "");
      foot.appendChild(back); v.appendChild(foot);
      focusView();
    }

    // ---- auth screens ----
    function escapeHtml(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

    function renderLogin() {
      document.body.classList.remove("authed");
      var r = document.getElementById("recall"); if (r) r.innerHTML = "";
      var host = document.getElementById("px-install"); if (host) host.innerHTML = "";
      var v = view();
      var wrap = document.createElement("div"); wrap.className = "authwrap";
      wrap.innerHTML =
        '<div class="authcard">' +
          '<p class="data authcard__eyebrow">Propelr · invite-only</p>' +
          '<h1 class="authcard__title">Welcome back</h1>' +
          '<p class="authcard__sub">Log in with the details you were given.</p>' +
          '<form id="loginForm" novalidate>' +
            '<label class="field"><span class="field__l">Email address</span><input class="input" id="loginEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@work.com" required></label>' +
            '<label class="field"><span class="field__l">Password</span><input class="input" id="loginPw" type="password" autocomplete="current-password" placeholder="Your password" required></label>' +
            '<p class="auth-err" id="loginErr" role="alert"></p>' +
            '<button class="btn btn--lg btn--block" id="loginBtn" type="submit" style="margin-top:var(--s5)">Log in</button>' +
          '</form>' +
        '</div>' +
        '<div class="authcard authcard--soft">' +
          '<h2 class="authcard__subtitle">Don’t have an invite?</h2>' +
          '<p class="authcard__sub">Propelr is invite-only. Leave your email and we’ll reach out when a place opens up.</p>' +
          '<form id="inviteForm" class="invite-row" novalidate>' +
            '<input class="input" id="inviteEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@work.com" aria-label="Your email address" required>' +
            '<button class="btn btn--secondary" id="inviteBtn" type="submit">Send invite' + (PX.icon ? PX.icon("send", "btn__i") : "") + '</button>' +
          '</form>' +
          '<p class="auth-msg" id="inviteMsg" role="status"></p>' +
        '</div>';
      v.appendChild(wrap);

      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
        err.textContent = ""; btn.disabled = true; btn.textContent = "Logging in…";
        PXAuth.login(document.getElementById("loginEmail").value, document.getElementById("loginPw").value).then(function (res) {
          if (res && res.ok) { (PXAuth.pullProgress ? PXAuth.pullProgress() : Promise.resolve()).then(startApp); }
          else { err.textContent = (res && res.error) || "Login failed."; btn.disabled = false; btn.textContent = "Log in"; }
        });
      });

      document.getElementById("inviteForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = document.getElementById("inviteBtn"), msg = document.getElementById("inviteMsg"), email = document.getElementById("inviteEmail");
        msg.textContent = ""; msg.className = "auth-msg"; btn.disabled = true; btn.textContent = "Sending…";
        PXAuth.requestInvite(email.value).then(function (res) {
          if (res && res.ok) {
            msg.textContent = "Thanks — your request is in. We’ll be in touch by email."; msg.className = "auth-msg is-ok";
            email.value = ""; email.disabled = true; btn.textContent = "Sent ✓";
          } else {
            msg.textContent = (res && res.error) || "Couldn’t send that."; msg.className = "auth-msg is-err";
            btn.disabled = false; btn.innerHTML = "Send invite" + (PX.icon ? PX.icon("send", "btn__i") : "");
          }
        });
      });

      document.getElementById("loginEmail").focus();
      focusView();
    }

    function paintAvatar(el, s) { el.innerHTML = (s && s.avatar) ? '<img class="avatar__img" src="' + s.avatar + '" alt="Your avatar">' : PXAuth.initials(); }
    function resizeImage(file, max, cb) {
      if (!file || !/^image\//.test(file.type)) return;
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        try { cb(c.toDataURL("image/jpeg", 0.85)); } catch (e) {}
      };
      img.onerror = function () { URL.revokeObjectURL(url); };
      img.src = url;
    }
    function fileInput(multiple, cb) {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.className = "visually-hidden"; if (multiple) inp.multiple = true;
      inp.addEventListener("change", function () {
        Array.prototype.slice.call(inp.files || []).forEach(function (f) { resizeImage(f, 512, cb); });
        inp.value = "";
      });
      return inp;
    }
    function renderGallery(gallery) {
      var s = PXAuth.session(); var pics = (s && s.pictures) || [];
      gallery.innerHTML = "";
      pics.forEach(function (src, i) {
        var item = document.createElement("div"); item.className = "gallery__item";
        item.innerHTML = '<img src="' + src + '" alt="Profile picture ' + (i + 1) + '">';
        var rm = document.createElement("button"); rm.className = "gallery__rm"; rm.type = "button"; rm.setAttribute("aria-label", "Remove picture " + (i + 1)); rm.textContent = "×";
        rm.addEventListener("click", function () { var cur = (PXAuth.session().pictures || []).slice(); cur.splice(i, 1); PXAuth.saveProfile({ pictures: cur }).then(function () { renderGallery(gallery); }); });
        item.appendChild(rm); gallery.appendChild(item);
      });
      if (pics.length < 8) {
        var add = document.createElement("button"); add.className = "gallery__add"; add.type = "button"; add.textContent = "+ Add";
        var inp = fileInput(true, function (url) { var cur = (PXAuth.session().pictures || []).slice(); cur.push(url); PXAuth.saveProfile({ pictures: cur }).then(function () { renderGallery(gallery); }); });
        add.addEventListener("click", function () { inp.click(); });
        gallery.appendChild(add); gallery.appendChild(inp);
      }
    }
    function renderProfile() {
      var s = PXAuth.session(); if (!s) return renderLogin();
      var v = view();
      var bar = document.createElement("div"); bar.className = "between";
      bar.innerHTML = '<a class="btn btn--ghost btn--sm" href="#/">← Map</a><span class="data">profile</span>';
      v.appendChild(bar);

      var head = document.createElement("div"); head.className = "profile-head"; head.style.marginTop = "var(--s4)";
      var avatar = document.createElement("div"); avatar.className = "avatar avatar--lg"; paintAvatar(avatar, s);
      var col = document.createElement("div");
      col.innerHTML = '<h1 class="t-h1" style="margin:0" id="pfTitle">' + escapeHtml(s.name || s.email.split("@")[0]) + '</h1><p class="data muted" style="margin-top:4px">' + escapeHtml(s.email) + '</p>';
      var changeBtn = document.createElement("button"); changeBtn.className = "btn btn--secondary btn--sm"; changeBtn.type = "button"; changeBtn.style.marginTop = "var(--s2)"; changeBtn.textContent = s.avatar ? "Change photo" : "Add photo";
      var avInput = fileInput(false, function (dataUrl) { PXAuth.saveProfile({ avatar: dataUrl }).then(function () { paintAvatar(avatar, PXAuth.session()); changeBtn.textContent = "Change photo"; refreshProfileButton(); if (PX.toast) PX.toast("Photo updated", { duration: 1800 }); }); });
      changeBtn.addEventListener("click", function () { avInput.click(); });
      col.appendChild(changeBtn); col.appendChild(avInput);
      head.appendChild(avatar); head.appendChild(col); v.appendChild(head);

      var card = document.createElement("div"); card.className = "card"; card.style.marginTop = "var(--s5)";
      card.innerHTML = '<label class="field"><span class="field__l">Display name</span><input class="input" id="pfName" type="text" value="' + escapeHtml(s.name || "") + '" maxlength="60"></label>';
      var save = document.createElement("button"); save.className = "btn btn--sm"; save.type = "button"; save.style.marginTop = "var(--s3)"; save.textContent = "Save name";
      save.addEventListener("click", function () {
        var name = document.getElementById("pfName").value.trim(); if (!name) return;
        save.disabled = true; save.textContent = "Saving…";
        PXAuth.saveProfile({ name: name }).then(function () { save.disabled = false; save.textContent = "Save name"; refreshProfileButton(); var t = document.getElementById("pfTitle"); if (t) t.textContent = name; if (PX.toast) PX.toast("Name saved", { duration: 1800 }); });
      });
      card.appendChild(save); v.appendChild(card);

      var gcard = document.createElement("div"); gcard.className = "card"; gcard.style.marginTop = "var(--s4)";
      gcard.innerHTML = '<p class="data">your pictures</p><p class="reading muted" style="margin-top:4px">Add a few images to your profile. They stay on this device.</p>';
      var gallery = document.createElement("div"); gallery.className = "gallery"; gcard.appendChild(gallery); v.appendChild(gcard);
      renderGallery(gallery);

      var out = document.createElement("div"); out.className = "section";
      var logout = document.createElement("button"); logout.className = "btn btn--secondary"; logout.type = "button"; logout.textContent = "Log out";
      logout.addEventListener("click", function () { logout.disabled = true; PXAuth.logout().then(function () { document.body.classList.remove("authed"); renderLogin(); }); });
      out.appendChild(logout); v.appendChild(out);
      focusView();
    }

    // ---- Menu destinations ----
    function crumb(v, label, backHref, backLabel) {
      var bar = document.createElement("div"); bar.className = "between";
      bar.innerHTML = '<a class="btn btn--ghost btn--sm" href="' + (backHref || "#/") + '">← ' + (backLabel || "Topics") + '</a><span class="data">' + label + '</span>';
      v.appendChild(bar);
    }
    function safeUrl(u) { u = String(u || ""); return /^https?:\/\//i.test(u) ? u : ""; }

    function renderRoadmap() {
      var v = view(); crumb(v, "roadmap");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Your roadmap</h1>' +
        '<p class="reading muted">Three foundations to start. Each lesson meets you at your level (right now: <b>' + Adapt.tierLabel() + '</b>) — a short video, a quick check, and something to apply. Finish a topic to unlock its flashcards.</p>';
      v.appendChild(h);
      var OUT = { apis: "Explain what an API is and read a simple call.", web: "Trace what happens when a page loads, and read status codes.", data: "Read a table and know when two tables join." };
      var wrap = document.createElement("div"); wrap.className = "rmap";
      CONCEPTS.forEach(function (id, i) {
        var c = PXContent.CONCEPTS[id]; var pc = topicPct(id); var done = topicDone(id);
        var row = document.createElement("a"); row.className = "rmap__row" + (done ? " is-done" : ""); row.href = "#/c/" + id; row.style.textDecoration = "none"; row.style.color = "var(--ink)";
        row.innerHTML = '<span class="rmap__n">' + (done ? PX.icon("check") : (i + 1)) + '</span>' +
          '<span style="flex:1"><span class="data concept-card__area">' + c.area + '</span>' +
          '<h3 style="margin:2px 0 4px">' + c.title + '</h3>' +
          '<p class="muted" style="margin:0">You’ll be able to: ' + OUT[id] + '</p>' +
          '<span class="rmap__bar"><span class="rmap__fill" style="width:' + pc + '%"></span></span></span>' +
          '<span class="data">' + (done ? "done" : pc ? pc + "%" : "start") + '</span>';
        wrap.appendChild(row);
      });
      v.appendChild(wrap);
      var more = document.createElement("p"); more.className = "reading muted"; more.style.marginTop = "var(--s5)";
      more.textContent = "More topics — auth & security, deploys, Git, the AI layer — join the path as these foundations land.";
      v.appendChild(more);
      focusView();
    }

    function renderHow() {
      var v = view(); crumb(v, "guide");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">How Propelr works</h1><p class="reading muted">The short version.</p>';
      v.appendChild(h);
      var items = [
        ["refresh", "It meets you at your level", "A quick placement sets your starting point. Lessons adjust — more guidance at Novice, problem-first at Advanced. Change your level any time from the Menu."],
        ["book", "Watch, then try", "Each topic opens with a short video (under ten minutes), then a quick check and a task to apply it to your own work."],
        ["map", "Go deeper when you want", "In-depth videos, code walkthroughs and source links sit quietly under each lesson — open them only if you want them."],
        ["cards", "Lock it in with flashcards", "Finish a topic and its flashcards unlock, for fast recall later."],
        ["share", "Share what you build", "Post projects to the Showcase and see what others are making."],
        ["user", "Yours, across devices", "Add it to your home screen, use it offline, and your progress syncs when you’re back online."]
      ];
      var wrap = document.createElement("div"); wrap.className = "how";
      items.forEach(function (it) { var d = document.createElement("div"); d.className = "how__item"; d.innerHTML = '<span class="how__ic">' + PX.icon(it[0]) + '</span><div><h3>' + it[1] + '</h3><p>' + it[2] + '</p></div>'; wrap.appendChild(d); });
      v.appendChild(wrap); focusView();
    }

    function renderShowcase() {
      var v = view(); crumb(v, "showcase");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Share a project</h1><p class="reading muted">Show what you’re building or learning. Everyone signed in can see the wall.</p>';
      v.appendChild(h);
      var form = document.createElement("form"); form.className = "sc-form"; form.setAttribute("novalidate", "");
      form.innerHTML =
        '<label class="field"><span class="field__l">Title</span><input class="input" id="scTitle" type="text" maxlength="120" placeholder="What is it?" required></label>' +
        '<label class="field"><span class="field__l">A few words</span><textarea id="scBody" maxlength="600" placeholder="What did you make or learn?"></textarea></label>' +
        '<label class="field"><span class="field__l">Link (optional)</span><input class="input" id="scLink" type="text" inputmode="url" placeholder="https://…"></label>' +
        '<p class="auth-msg" id="scMsg" role="status"></p>' +
        '<button class="btn" id="scBtn" type="submit" style="margin-top:var(--s3)">Share' + PX.icon("send", "btn__i") + '</button>';
      v.appendChild(form);
      var list = document.createElement("div"); list.className = "sc-list"; v.appendChild(list);

      function paint(posts) {
        list.innerHTML = "";
        if (!posts || !posts.length) { list.innerHTML = '<div class="sc-empty">No posts yet — be the first to share something.</div>'; return; }
        posts.forEach(function (p) {
          var card = document.createElement("div"); card.className = "sc-post";
          var u = safeUrl(p.link);
          var link = u ? '<a class="sc-post__link" href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">Open link ↗</a>' : '';
          card.innerHTML = '<div class="sc-post__top"><span class="data sc-post__by">' + escapeHtml(p.name || "Someone") + '</span></div>' +
            '<h3>' + escapeHtml(p.title || "") + '</h3>' + (p.body ? '<p class="muted" style="margin:0">' + escapeHtml(p.body) + '</p>' : '') + link;
          if (PXAuth.mine(p)) {
            var rm = document.createElement("button"); rm.className = "btn btn--ghost btn--sm"; rm.type = "button"; rm.textContent = "Delete"; rm.style.marginTop = "var(--s2)";
            rm.addEventListener("click", function () { PXAuth.deletePost(p.id).then(load); });
            card.appendChild(rm);
          }
          list.appendChild(card);
        });
      }
      function load() { PXAuth.listPosts().then(paint); }
      load();

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var title = document.getElementById("scTitle").value.trim(), body = document.getElementById("scBody").value.trim(), link = document.getElementById("scLink").value.trim();
        var msg = document.getElementById("scMsg"), btn = document.getElementById("scBtn");
        if (!title) { msg.textContent = "Add a title."; msg.className = "auth-msg is-err"; return; }
        if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
        btn.disabled = true; btn.textContent = "Sharing…"; msg.textContent = ""; msg.className = "auth-msg";
        PXAuth.addPost({ title: title, body: body, link: link }).then(function (res) {
          btn.disabled = false; btn.innerHTML = "Share" + PX.icon("send", "btn__i");
          form.reset();
          msg.textContent = res && res.synced === false ? "Shared on this device — it’ll sync when you’re online." : "Shared!"; msg.className = "auth-msg is-ok";
          evaluateBadges();                       // "Shipped it"
          load();
        });
      });
      focusView();
    }

    function renderFlashcards() {
      var v = view(); crumb(v, "flashcards");
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Flashcards</h1><p class="reading muted">Quick recall for each topic. A topic’s cards unlock once you’ve finished that topic.</p>';
      v.appendChild(h);
      var grid = document.createElement("div"); grid.className = "fc-grid";
      CONCEPTS.forEach(function (id) {
        var c = PXContent.CONCEPTS[id]; var cards = PXContent.FLASHCARDS[id] || []; var unlocked = topicDone(id);
        var el = document.createElement("div"); el.className = "fc-topic" + (unlocked ? "" : " is-locked");
        el.innerHTML = '<span class="data concept-card__area">' + c.area + '</span><h3 style="margin:0">' + c.title + '</h3><p class="muted" style="margin:0">' + cards.length + ' cards</p>';
        if (unlocked) { var go = document.createElement("a"); go.className = "btn btn--sm"; go.href = "#/fc/" + id; go.style.marginTop = "var(--s2)"; go.textContent = "Study"; el.appendChild(go); }
        else { var lock = document.createElement("span"); lock.className = "fc-topic__lock"; lock.style.marginTop = "var(--s2)"; lock.innerHTML = PX.icon("lock") + "Finish the topic to unlock"; el.appendChild(lock); }
        grid.appendChild(el);
      });
      v.appendChild(grid); focusView();
    }

    function renderFlashcardsFor(id) {
      var cards = PXContent.FLASHCARDS[id] || [];
      if (!cards.length || !topicDone(id)) { location.hash = "#/flashcards"; return; }
      var v = view();
      crumb(v, PXContent.CONCEPTS[id].area, "#/flashcards", "Flashcards");
      var h = document.createElement("h1"); h.className = "t-h1"; h.style.margin = "var(--s3) 0 0"; h.textContent = PXContent.CONCEPTS[id].title; v.appendChild(h);

      var i = 0, showBack = false;
      var card = document.createElement("div"); card.className = "flashcard"; card.setAttribute("role", "button"); card.setAttribute("tabindex", "0"); card.setAttribute("aria-label", "Flashcard — activate to flip");
      var nav = document.createElement("div"); nav.className = "fc-nav";
      var prev = document.createElement("button"); prev.className = "btn btn--secondary btn--sm"; prev.type = "button"; prev.textContent = "← Prev";
      var count = document.createElement("span"); count.className = "fc-count";
      var next = document.createElement("button"); next.className = "btn btn--sm"; next.type = "button"; next.textContent = "Next →";
      nav.appendChild(prev); nav.appendChild(count); nav.appendChild(next);

      function paint() {
        var c = cards[i];
        card.innerHTML = '<div class="flashcard__side"><span class="data">' + (showBack ? "answer" : "question") + '</span>' + escapeHtml(showBack ? c.a : c.q) + '</div><span class="flashcard__hint">' + (showBack ? "tap for the question" : "tap to reveal the answer") + '</span>';
        count.textContent = (i + 1) + " / " + cards.length;
        prev.disabled = i === 0; next.disabled = i === cards.length - 1;
      }
      function flip() { showBack = !showBack; paint(); }
      card.addEventListener("click", flip);
      card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
      prev.addEventListener("click", function () { if (i > 0) { i--; showBack = false; paint(); } });
      next.addEventListener("click", function () { if (i < cards.length - 1) { i++; showBack = false; paint(); } });
      v.appendChild(card); v.appendChild(nav);
      paint(); focusView();
    }

    function renderBadges() {
      evaluateBadges();
      var v = view(); crumb(v, "badges");
      var earned = PXStore.state.badges || {};
      var got = BADGES.filter(function (b) { return earned[b.id]; }).length;
      var h = document.createElement("div");
      h.innerHTML = '<h1 class="t-h1" style="margin:var(--s3) 0 var(--s2)">Your badges</h1>' +
        '<p class="reading muted"><b>' + got + '</b> of ' + BADGES.length + ' earned. Keep a streak, finish videos, complete topics and share projects to collect the rest.</p>';
      v.appendChild(h);
      var grid = document.createElement("div"); grid.className = "badges";
      BADGES.forEach(function (b) {
        var on = !!earned[b.id];
        var el = document.createElement("div"); el.className = "badge " + (on ? "is-earned" : "is-locked");
        el.innerHTML = '<span class="badge__ic">' + PX.icon(on ? b.icon : "lock") + '</span>' +
          '<span class="badge__name">' + b.name + '</span><span class="badge__desc">' + b.desc + '</span>';
        grid.appendChild(el);
      });
      v.appendChild(grid);
      focusView();
    }
  </script>
</body>
