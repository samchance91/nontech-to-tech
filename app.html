<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Learn how software really works — adaptive, hands-on, at your level. Works offline." />
  <title>Propelr — Tech for Non-Tech People</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar__in">
      <a class="wordmark" href="#/" aria-label="Propelr home"><span class="wordmark__dot" aria-hidden="true"></span>Propelr</a>
      <div class="appbar__actions">
        <span class="offline-pill" role="status">● offline</span>
        <label class="vspeed needs-auth" style="gap:6px"><span class="data">level</span>
          <select id="tierSel" class="vspeed__sel" aria-label="Your level — change anytime"></select>
        </label>
        <button class="profilebtn needs-auth" id="profileBtn" type="button" aria-label="Your profile"></button>
        <button class="btn btn--secondary btn--sm" id="themeBtn" type="button" aria-label="Toggle theme">Theme</button>
      </div>
    </div>
  </header>

  <div id="recall" class="container" style="padding:0 var(--s4)"></div>
  <main id="view" class="container" style="padding:var(--s5) var(--s4) var(--s9)" tabindex="-1"></main>
  <div id="px-install" class="install-dock"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Propelr needs JavaScript. The full course text is also in <a href="classic.html">the classic version</a>.</p></noscript>

  <script src="assets/app.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/adapt.js"></script>
  <script src="assets/baseline.js"></script>
  <script src="assets/content.js"></script>
  <script src="assets/video.js"></script>
  <script src="assets/lesson.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
    var TIER_KEYS = ["novice", "beginner", "intermediate", "advanced"];
    var CONCEPTS = ["apis", "web", "data"];
    // Where "request access" emails go. Propelr is invite-only — change this to your preferred address.
    var CONTACT_EMAIL = "shubham.0604@gmail.com";
    var appWired = false;

    // ---- theme ----
    (function () {
      var saved = null; try { saved = localStorage.getItem("px_theme"); } catch (e) {}
      if (saved) document.documentElement.setAttribute("data-theme", saved);
      document.getElementById("themeBtn").addEventListener("click", function () {
        var root = document.documentElement;
        var cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = cur === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("px_theme", next); } catch (e) {}
      });
    })();

    PXStore.init().then(function () {
      setOffline(!navigator.onLine);
      window.addEventListener("online", function () { setOffline(false); });
      window.addEventListener("offline", function () { setOffline(true); });
      document.getElementById("profileBtn").addEventListener("click", function () { location.hash = "#/profile"; });

      if (!PXAuth.session()) { renderLogin(); return; }   // invite-only gate
      startApp();
    });

    function startApp() {
      document.body.classList.add("authed");
      refreshProfileButton();
      PXPWA.init();
      Adapt.startSession();                       // streak + long-gap recall check
      renderTierSel();
      if (!appWired) { Adapt.on(onDirective); window.addEventListener("hashchange", route); appWired = true; }
      if (location.hash === "#/login" || !location.hash) location.hash = "#/";
      route();
    }

    function refreshProfileButton() {
      var s = PXAuth.session(); if (!s) return;
      var av = s.avatar ? '<img class="avatar__img" src="' + s.avatar + '" alt="">' : PXAuth.initials();
      document.getElementById("profileBtn").innerHTML = '<span class="avatar" aria-hidden="true">' + av + '</span><span>' + (s.name || s.email) + '</span>';
    }

    function setOffline(v) { document.body.classList.toggle("is-offline", !!v); }
    function tierIdx() { return Math.max(0, TIER_KEYS.indexOf(Adapt.tier())); }

    function renderTierSel() {
      var sel = document.getElementById("tierSel");
      sel.innerHTML = TIER_KEYS.map(function (k) {
        return '<option value="' + k + '"' + (k === Adapt.tier() ? " selected" : "") + ">" + Adapt.LABEL[k] + "</option>";
      }).join("");
      sel.onchange = function () { Adapt.setTier(sel.value, { overridden: true }); route(); };
    }

    // ---- global directive handling (fires from Adapt across screens) ----
    function card(cls, title, body, actions) {
      var d = document.createElement("div"); d.className = "directive " + cls;
      d.innerHTML = '<div class="directive__h">' + title + '</div>' + (body ? '<div class="directive__b">' + body + '</div>' : '') + (actions ? '<div class="row">' + actions + '</div>' : '');
      return d;
    }
    function onDirective(d) {
      if (d.type === "tierChanged") { renderTierSel(); if (PX.toast) PX.toast("Level: " + Adapt.LABEL[d.tier] + (d.overridden ? " (you set this)" : " (stepped up)"), { duration: 2200 }); }
      if (d.type === "recallCheck") {
        var r = document.getElementById("recall"); if (!r) return;
        r.innerHTML = "";
        var el = card("directive--recall", "Welcome back", "It’s been " + d.gapDays + " days. Want a 30-second refresher before you carry on? No pressure — jump straight in if you’d rather.",
          '<button class="btn btn--sm" data-skip type="button">Sounds good</button><button class="btn btn--ghost btn--sm" data-skip type="button">Skip</button>');
        el.style.margin = "var(--s3) 0";
        r.appendChild(el);
        r.querySelectorAll("[data-skip]").forEach(function (b) { b.addEventListener("click", function () { r.innerHTML = ""; }); });
      }
      if (d.type === "offerStepUp") {
        var slot = document.getElementById("directives"); if (!slot) return;
        var up = card("directive--up", (PX.icon ? PX.icon("spark") : "") + " You’re flying — ready for harder?",
          "Two clean answers in a row. Step up to <b>" + Adapt.LABEL[d.to] + "</b> for less scaffolding and tougher transfer tasks. Drop back anytime.",
          '<button class="btn btn--sm" data-accept type="button">Step up</button><button class="btn btn--ghost btn--sm" data-no type="button">Not yet</button>');
        up.querySelector("[data-accept]").addEventListener("click", function () { Adapt.acceptStepUp(d.to); up.remove(); route(); });
        up.querySelector("[data-no]").addEventListener("click", function () { up.remove(); });
        slot.appendChild(up);
      }
      if (d.type === "remediation") {
        var s2 = document.getElementById("directives"); if (!s2) return;
        s2.appendChild(card("directive--rem", (PX.icon ? PX.icon("check") : "") + " Let’s build that up a step",
          "Here’s the same idea broken smaller — a quick worked example from the ground up, then we’ll try again.", ""));
      }
      if (d.type === "surfaceAlt") {
        var a = document.getElementById("altSlot"); if (!a) return;
        a.innerHTML = ""; a.appendChild(card("directive--alt", "Prefer to read it?", "You’ve replayed that part a few times — here’s the same idea in text, no video needed.", ""));
      }
    }

    // ---- router ----
    function route() {
      if (!PXAuth.session()) return renderLogin();
      var h = location.hash || "#/";
      var m = h.match(/^#\/c\/(\w+)/);
      if (h === "#/profile") return renderProfile();
      if (h === "#/baseline") return renderBaseline();
      if (m && CONCEPTS.indexOf(m[1]) >= 0) return renderConcept(m[1]);
      return renderHome();
    }
    function view() { var v = document.getElementById("view"); v.innerHTML = ""; return v; }
    function focusView() { var v = document.getElementById("view"); try { v.focus({ preventScroll: true }); } catch (e) {} }

    // mastery: 0–2 per concept (watched ≥50% ·+ a correct first-try answer)
    function mastery(id) {
      var c = (Adapt.snapshot().concepts[id]) || {};
      var m = 0;
      if (c.video && c.video.watchedPct >= 50) m++;
      if (c.firstTry && c.firstTry.some(function (x) { return x; })) m++;
      return m;
    }

    function renderHome() {
      var v = view();
      var done = !!PXStore.state.baseline;
      var head = document.createElement("div");
      head.className = "stack";
      head.innerHTML =
        '<p class="data">your map</p>' +
        '<h1 class="t-h1" style="margin:4px 0 0">' + (done ? "Pick up where you left off" : "Welcome — let’s find your level") + '</h1>' +
        '<p class="reading muted" style="margin-top:var(--s2)">Level <b>' + Adapt.tierLabel() + '</b> · streak <b>' + (Adapt.snapshot().session.streak || 0) + '</b> day(s). Change your level any time up top — the lessons reshape to match.</p>';
      v.appendChild(head);

      if (!done) {
        var cal = document.createElement("div"); cal.className = "card"; cal.style.marginTop = "var(--s5)";
        cal.innerHTML = '<p class="data">2 minutes</p><h2 style="margin:4px 0 var(--s2)">Find your level</h2><p class="reading muted">Six quick questions calibrate the starting point. No score, no pass/fail — it just sets how much we scaffold.</p>';
        var go = document.createElement("a"); go.className = "btn"; go.href = "#/baseline"; go.style.marginTop = "var(--s3)"; go.innerHTML = "Find my level" + (PX.icon ? PX.icon("arrowR", "btn__i") : "");
        cal.appendChild(go); v.appendChild(cal);
      }

      var atlas = document.createElement("div"); atlas.className = "card"; atlas.style.marginTop = "var(--s5)";
      atlas.innerHTML = '<p class="data" style="margin-bottom:var(--s2)">how far you’ve travelled</p>';
      var mount = document.createElement("div"); atlas.appendChild(mount); v.appendChild(atlas);
      PX.miniAtlas(mount, { nodes: CONCEPTS.map(function (id) { return { label: PXContent.CONCEPTS[id].area.split(" ")[0], total: 2, filled: mastery(id) }; }) });

      var grid = document.createElement("div"); grid.className = "conceptgrid";
      CONCEPTS.forEach(function (id) {
        var c = PXContent.CONCEPTS[id]; var p = Math.round(mastery(id) / 2 * 100);
        var b = document.createElement("button"); b.className = "concept-card"; b.type = "button";
        b.innerHTML =
          '<p class="data concept-card__area">' + c.area + '</p>' +
          '<h3 style="margin:0">' + c.title + '</h3>' +
          '<div class="concept-card__meta"><span class="concept-card__bar"><span class="concept-card__fill" style="--p:' + p + '%"></span></span>' +
          '<span class="data">' + (p === 100 ? "done" : p + "%") + '</span></div>';
        b.addEventListener("click", function () { location.hash = "#/c/" + id; });
        grid.appendChild(b);
      });
      v.appendChild(grid);
      focusView();
    }

    function renderBaseline() {
      var v = view();
      v.innerHTML = '<p class="data">calibration</p><h1 class="t-h1" style="margin:4px 0 var(--s4)">Find your level</h1>';
      var mount = document.createElement("div"); v.appendChild(mount);
      PX.Baseline(mount, { onDone: function (tier) {
        // bridge baseline result into the live store + engine
        PXStore.state.baseline = { tier: tier.key, at: Date.now() };
        Adapt.setTier(tier.key, { overridden: false });
        PXStore.save();
        renderTierSel();
        location.hash = "#/";
      } });
      focusView();
    }

    function renderConcept(id) {
      var v = view();
      var c = PXContent.CONCEPTS[id];
      var bar = document.createElement("div"); bar.className = "between";
      bar.innerHTML = '<a class="btn btn--ghost btn--sm" href="#/">← Map</a><span class="data">' + c.area + '</span>';
      v.appendChild(bar);
      var h = document.createElement("h1"); h.className = "t-h1"; h.style.margin = "var(--s3) 0 var(--s2)"; h.textContent = c.title; v.appendChild(h);

      var dir = document.createElement("div"); dir.id = "directives"; dir.setAttribute("aria-live", "polite"); v.appendChild(dir);
      var alt = document.createElement("div"); alt.id = "altSlot"; v.appendChild(alt);

      var mount = document.createElement("div"); mount.style.marginTop = "var(--s4)"; v.appendChild(mount);
      PXLesson.render(mount, id, tierIdx(), { onSignal: function () { /* live signals; home reflects them on return */ } });

      var foot = document.createElement("div"); foot.className = "section";
      var back = document.createElement("a"); back.className = "btn btn--secondary"; back.href = "#/"; back.innerHTML = "Back to the map" + (PX.icon ? PX.icon("arrowR", "btn__i") : "");
      foot.appendChild(back); v.appendChild(foot);
      focusView();
    }

    // ---- auth screens ----
    function escapeHtml(x) { return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

    function renderLogin() {
      document.body.classList.remove("authed");
      var r = document.getElementById("recall"); if (r) r.innerHTML = "";
      var host = document.getElementById("px-install"); if (host) host.innerHTML = "";
      var v = view();
      var wrap = document.createElement("div"); wrap.className = "authwrap";
      wrap.innerHTML =
        '<p class="data">welcome</p>' +
        '<h1 class="t-h1" style="margin:4px 0 var(--s2)">Log in to Propelr</h1>' +
        '<p class="reading muted">Propelr is invite-only. Log in with the details you were given.</p>' +
        '<form class="authcard" id="loginForm" novalidate style="margin-top:var(--s4)">' +
          '<label class="field"><span class="field__l">Email</span><input class="input" id="loginEmail" type="email" autocomplete="email" inputmode="email" required></label>' +
          '<label class="field"><span class="field__l">Password</span><input class="input" id="loginPw" type="password" autocomplete="current-password" required></label>' +
          '<p class="auth-err" id="loginErr" role="alert"></p>' +
          '<button class="btn" id="loginBtn" type="submit" style="margin-top:var(--s4);width:100%;justify-content:center">Log in</button>' +
          '<div class="auth-invite">' + (PX.icon ? PX.icon("spark") : "") + '<p>No account yet? Propelr is invite-only — email <a href="mailto:' + CONTACT_EMAIL + '?subject=Propelr%20access%20request&body=Hi%2C%20I%27d%20like%20access%20to%20Propelr.">' + CONTACT_EMAIL + '</a> to request an invite.</p></div>' +
        '</form>';
      v.appendChild(wrap);
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
        err.textContent = ""; btn.disabled = true; btn.textContent = "Logging in…";
        PXAuth.login(document.getElementById("loginEmail").value, document.getElementById("loginPw").value).then(function (res) {
          if (res && res.ok) { (PXAuth.pullProgress ? PXAuth.pullProgress() : Promise.resolve()).then(startApp); }
          else { err.textContent = (res && res.error) || "Login failed."; btn.disabled = false; btn.textContent = "Log in"; }
        });
      });
      document.getElementById("loginEmail").focus();
      focusView();
    }

    function paintAvatar(el, s) { el.innerHTML = (s && s.avatar) ? '<img class="avatar__img" src="' + s.avatar + '" alt="Your avatar">' : PXAuth.initials(); }
    function resizeImage(file, max, cb) {
      if (!file || !/^image\//.test(file.type)) return;
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        try { cb(c.toDataURL("image/jpeg", 0.85)); } catch (e) {}
      };
      img.onerror = function () { URL.revokeObjectURL(url); };
      img.src = url;
    }
    function fileInput(multiple, cb) {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.className = "visually-hidden"; if (multiple) inp.multiple = true;
      inp.addEventListener("change", function () {
        Array.prototype.slice.call(inp.files || []).forEach(function (f) { resizeImage(f, 512, cb); });
        inp.value = "";
      });
      return inp;
    }
    function renderGallery(gallery) {
      var s = PXAuth.session(); var pics = (s && s.pictures) || [];
      gallery.innerHTML = "";
      pics.forEach(function (src, i) {
        var item = document.createElement("div"); item.className = "gallery__item";
        item.innerHTML = '<img src="' + src + '" alt="Profile picture ' + (i + 1) + '">';
        var rm = document.createElement("button"); rm.className = "gallery__rm"; rm.type = "button"; rm.setAttribute("aria-label", "Remove picture " + (i + 1)); rm.textContent = "×";
        rm.addEventListener("click", function () { var cur = (PXAuth.session().pictures || []).slice(); cur.splice(i, 1); PXAuth.saveProfile({ pictures: cur }).then(function () { renderGallery(gallery); }); });
        item.appendChild(rm); gallery.appendChild(item);
      });
      if (pics.length < 8) {
        var add = document.createElement("button"); add.className = "gallery__add"; add.type = "button"; add.textContent = "+ Add";
        var inp = fileInput(true, function (url) { var cur = (PXAuth.session().pictures || []).slice(); cur.push(url); PXAuth.saveProfile({ pictures: cur }).then(function () { renderGallery(gallery); }); });
        add.addEventListener("click", function () { inp.click(); });
        gallery.appendChild(add); gallery.appendChild(inp);
      }
    }
    function renderProfile() {
      var s = PXAuth.session(); if (!s) return renderLogin();
      var v = view();
      var bar = document.createElement("div"); bar.className = "between";
      bar.innerHTML = '<a class="btn btn--ghost btn--sm" href="#/">← Map</a><span class="data">profile</span>';
      v.appendChild(bar);

      var head = document.createElement("div"); head.className = "profile-head"; head.style.marginTop = "var(--s4)";
      var avatar = document.createElement("div"); avatar.className = "avatar avatar--lg"; paintAvatar(avatar, s);
      var col = document.createElement("div");
      col.innerHTML = '<h1 class="t-h1" style="margin:0" id="pfTitle">' + escapeHtml(s.name || s.email.split("@")[0]) + '</h1><p class="data muted" style="margin-top:4px">' + escapeHtml(s.email) + '</p>';
      var changeBtn = document.createElement("button"); changeBtn.className = "btn btn--secondary btn--sm"; changeBtn.type = "button"; changeBtn.style.marginTop = "var(--s2)"; changeBtn.textContent = s.avatar ? "Change photo" : "Add photo";
      var avInput = fileInput(false, function (dataUrl) { PXAuth.saveProfile({ avatar: dataUrl }).then(function () { paintAvatar(avatar, PXAuth.session()); changeBtn.textContent = "Change photo"; refreshProfileButton(); if (PX.toast) PX.toast("Photo updated", { duration: 1800 }); }); });
      changeBtn.addEventListener("click", function () { avInput.click(); });
      col.appendChild(changeBtn); col.appendChild(avInput);
      head.appendChild(avatar); head.appendChild(col); v.appendChild(head);

      var card = document.createElement("div"); card.className = "card"; card.style.marginTop = "var(--s5)";
      card.innerHTML = '<label class="field"><span class="field__l">Display name</span><input class="input" id="pfName" type="text" value="' + escapeHtml(s.name || "") + '" maxlength="60"></label>';
      var save = document.createElement("button"); save.className = "btn btn--sm"; save.type = "button"; save.style.marginTop = "var(--s3)"; save.textContent = "Save name";
      save.addEventListener("click", function () {
        var name = document.getElementById("pfName").value.trim(); if (!name) return;
        save.disabled = true; save.textContent = "Saving…";
        PXAuth.saveProfile({ name: name }).then(function () { save.disabled = false; save.textContent = "Save name"; refreshProfileButton(); var t = document.getElementById("pfTitle"); if (t) t.textContent = name; if (PX.toast) PX.toast("Name saved", { duration: 1800 }); });
      });
      card.appendChild(save); v.appendChild(card);

      var gcard = document.createElement("div"); gcard.className = "card"; gcard.style.marginTop = "var(--s4)";
      gcard.innerHTML = '<p class="data">your pictures</p><p class="reading muted" style="margin-top:4px">Add a few images to your profile. They stay on this device.</p>';
      var gallery = document.createElement("div"); gallery.className = "gallery"; gcard.appendChild(gallery); v.appendChild(gcard);
      renderGallery(gallery);

      var out = document.createElement("div"); out.className = "section";
      var logout = document.createElement("button"); logout.className = "btn btn--secondary"; logout.type = "button"; logout.textContent = "Log out";
      logout.addEventListener("click", function () { logout.disabled = true; PXAuth.logout().then(function () { document.body.classList.remove("authed"); renderLogin(); }); });
      out.appendChild(logout); v.appendChild(out);
      focusView();
    }
  </script>
</body>
</html>
