name: Swift AI Academy CI

on:
  push:
    paths: ["swift-ai-academy/**", ".github/workflows/swift-ai-academy-ci.yml"]
  pull_request:
    paths: ["swift-ai-academy/**", ".github/workflows/swift-ai-academy-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: swift-ai-academy

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_anon_key_placeholder_0123456789
  # Canary: if this string ever appears in .next, the service key would have leaked into the bundle.
  SUPABASE_SERVICE_ROLE_KEY: CANARY_service_role_must_not_ship_7f3a9c

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swift-ai-academy/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and database tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Service-role key is not in the build output
        run: npm run check:secrets
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Gate tests (Playwright, desktop Chrome + Pixel)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: swift-ai-academy/playwright-report
