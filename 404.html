<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F7F7" />
  <title>Propelr — Redirecting…</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F7F7F7; color: #2C2C2C; text-align: center; }
    a { color: #2C2C2C; }
    @media (prefers-color-scheme: dark) { body { background: #17181A; color: #F2F2F3; } a { color: #F2F2F3; } }
  </style>
  <script>
    /* Any unknown path on the site lands here. Send it to the app, keeping the
       in-app route: if the path already looks like a hash route (/#/levels or
       /levels) preserve it as a hash so the router can pick it up. */
    (function () {
      var h = location.hash || "";
      if (!h) {
        var p = location.pathname.replace(/^\/+/, "");   // e.g. "levels" or "fc/apis"
        if (p && p.indexOf(".") === -1) h = "#/" + p;    // treat a clean path as an in-app route
      }
      location.replace("/" + h);
    })();
  </script>
</head>
<body>
  <p>Taking you to Propelr… <a href="/">Continue</a></p>
</body>
</html>
